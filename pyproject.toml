[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "groovehub"
version = "0.1.0"
description = "The MCP Server Registry with Automated Security Scoring"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "GrooveXlabs"},
]
keywords = ["mcp", "security", "scanner", "registry", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "sqlalchemy>=2.0",
    "httpx>=0.24",
    "click>=8.0",
    "rich>=13.0",
    "grooveguard>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
]

[project.scripts]
groovehub = "groovehub.cli:main"

[project.urls]
Homepage = "https://github.com/GrooveXlabs/groovehub"
Repository = "https://github.com/GrooveXlabs/groovehub"
Issues = "https://github.com/GrooveXlabs/groovehub/issues"

[tool.hatch.build.targets.wheel]
packages = ["groovehub"]

[tool.pytest.ini_options]
testpaths = ["groovehub/tests"]
pythonpath = ["."]
asyncio_mode = "strict"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
